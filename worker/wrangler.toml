name = "abundant-stream"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
# Keep variables added in the Cloudflare dashboard when GitHub deploys a new version.
keep_vars = true

# Runs every minute on Cloudflare (free plan); the code decides what to check each time.
[triggers]
crons = ["* * * * *"]

# Small key-value store for the Restream sign-in (created automatically on deploy).
[[kv_namespaces]]
binding = "STATE"
